<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header with app name and tagline -->
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple and organized note-taking companion</p>
    </header>

    <main>
        <!-- Section 1: Add a note -->
        <section class="add-note-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div>
                    <label for="note-text">Your notes</label>
                    <textarea id="note-text" placeholder="Type your note here..."></textarea>
                </div>
                
                <div>
                    <label for="category-select">Category:</label>
                    <select id="category-select">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <!-- Section 2: Your notes -->
        <section class="notes-display-section">
            <h2>Your notes</h2>
            <input type="text" id="search-input" placeholder="Search notes...">
            <p id="note-count">You have no notes yet.</p>
            <div id="notes-list"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
